[package]
name = "redmount"
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
winfsp = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
fuse_mt = "0.6"
libc = "0.2"

# Linux mounts via fusermount without libfuse; macOS needs macFUSE's libfuse.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.16", features = ["libfuse"] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }

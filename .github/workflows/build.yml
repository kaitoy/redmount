name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: redmount.exe
          - os: ubuntu-latest
            bin: redmount
          - os: macos-latest
            bin: redmount
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        run: choco install winfsp -y
      # Linux needs no FUSE headers (fuser mounts via fusermount); macOS links macFUSE's libfuse.
      - if: runner.os == 'macOS'
        run: brew install --cask macfuse && brew install pkgconf
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} LICENSE dist/
          cargo about generate about.hbs -o dist/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: redmount-${{ runner.os }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      # Artifacts drop the executable bit; restore it before zipping.
      - run: |
          chmod +x redmount-Linux/redmount redmount-macOS/redmount
          for d in redmount-*; do (cd "$d" && zip -r "../$d-$GITHUB_REF_NAME.zip" .); done
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes ./*.zip
        env:
          GH_TOKEN: ${{ github.token }}
